name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  job_build:
    name: Compilation for X, S+, Stax, Flex and Apex P

    strategy:
      matrix:
        include:
          - model: nanox
            SDK: "$NANOX_SDK"
          - model: nanosp
            SDK: "$NANOSP_SDK"
          - model: stax
            SDK: "$STAX_SDK"
          - model: flex
            SDK: "$FLEX_SDK"
          - model: apex_p
            SDK: "$APEX_P_SDK"

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        run: |
          make DEBUG=0 COIN=syscoin BOLOS_SDK=${{ matrix.SDK }} && mv bin/ syscoin-bin/
          make clean
          make DEBUG=0 COIN=syscoin_testnet BOLOS_SDK=${{ matrix.SDK }} && mv bin/ syscoin-testnet-bin/
      - name: Upload Syscoin app binary
        uses: actions/upload-artifact@v4
        with:
          name: syscoin-app-${{ matrix.model }}
          path: syscoin-bin

      - name: Upload Syscoin Testnet app binary
        uses: actions/upload-artifact@v4
        with:
          name: syscoin-testnet-app-${{ matrix.model }}
          path: syscoin-testnet-bin

  job_build_app_perftest:
    name: Compile the UX-less version of the app on Nano S+ for performance tests

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        run: |
          make DEBUG=0 COIN=syscoin_testnet BOLOS_SDK="$NANOSP_SDK" AUTOAPPROVE_FOR_PERF_TESTS=1

      - name: Upload Syscoin Testnet app binary
        uses: actions/upload-artifact@v4
        with:
          name: syscoin-testnet-perftest-app-nanosp
          path: bin

  job_unit_test:
    name: Unit test
    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build unit tests
        run: |
          cd unit-tests/
          cmake -Bbuild -H. && make -C build && make -C build test
      - name: Generate code coverage
        run: |
          cd unit-tests/
          lcov --directory . -b "$(realpath build/)" --capture --initial -o coverage.base && \
          lcov --rc lcov_branch_coverage=1 --directory . -b "$(realpath build/)" --capture -o coverage.capture && \
          lcov --directory . -b "$(realpath build/)" --add-tracefile coverage.base --add-tracefile coverage.capture -o coverage.info && \
          lcov --directory . -b "$(realpath build/)" --remove coverage.info '*/unit-tests/*' -o coverage.info && \
          genhtml coverage.info -o coverage
      - uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: unit-tests/coverage

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./unit-tests/coverage.info
          flags: unittests
          name: codecov-app-syscoin
          slug: Kmino-io/syscoin-ledger-app
          fail_ci_if_error: true
          verbose: true

      - name: HTML documentation
        run: doxygen .doxygen/Doxyfile

      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: doc/html

  job_test_mainnet:
    name: Tests on mainnet
    strategy:
      matrix:
        include:
          - model: nanox
          - model: nanosp
          - model: stax
          - model: flex
          - model: apex_p

    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/speculos:latest
      ports:
        - 1234:1234
        - 9999:9999
        - 40000:40000
        - 41000:41000
        - 42000:42000
        - 43000:43000
      options: --entrypoint /bin/bash

    steps:
      - name: Install git (required by checkout)
        run: apt-get update && apt-get install -y git
      - name: Clone
        uses: actions/checkout@v4

      - name: Download Syscoin app binary
        uses: actions/download-artifact@v4
        with:
          name: syscoin-app-${{matrix.model}}
          path: bin

      - name: Install build dependencies
        run: apt update && apt install -y build-essential

      - name: Run tests
        run: |
          pip install -r requirements.txt
          cd tests_mainnet
          PYTHONPATH=$PYTHONPATH:/speculos pytest --headless --model=${{ matrix.model }} --timeout=300

  job_test_python_lib_legacyapp:
    name: Python tests (Syscoin)
    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/speculos:latest
      ports:
        - 1234:1234
        - 9999:9999
        - 40000:40000
        - 41000:41000
        - 42000:42000
        - 43000:43000
      options: --entrypoint /bin/bash

    steps:
      - name: Install git (required by checkout)
        run: apt-get update && apt-get install -y git
      - name: Clone
        uses: actions/checkout@v4

      - name: Download Syscoin Testnet app binary (Nano S+)
        uses: actions/download-artifact@v4
        with:
          name: syscoin-testnet-app-nanosp
          path: bin

      - name: Prepare binary in expected path
        run: |
          DEVICE="nanos2"
          mkdir -p build/$DEVICE/bin
          cp bin/app.elf build/$DEVICE/bin/app.elf

      - name: Install build dependencies
        run: apt update && apt install -y build-essential

      - name: Run tests
        run: |
          pip install -r requirements.txt
          cd tests
          PYTHONPATH=$PYTHONPATH:/speculos pytest --headless --timeout=300 --device=nanosp

  job_perftests:
    name: Performance report

    needs: job_build_app_perftest
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/speculos:latest
      ports:
        - 1234:1234
        - 9999:9999
        - 40000:40000
        - 41000:41000
        - 42000:42000
        - 43000:43000
      options: --entrypoint /bin/bash

    steps:
      - name: Install git (required by checkout)
        run: apt-get update && apt-get install -y git
      - name: Clone
        uses: actions/checkout@v4

      - name: Download Syscoin app binary for perftests
        uses: actions/download-artifact@v4
        with:
          name: syscoin-testnet-perftest-app-nanosp
          path: bin

      - name: Install build dependencies
        run: apt update && apt install -y build-essential

      - name: Run tests
        run: |
          pip install -r requirements.txt
          cd tests_perf
          PYTHONPATH=$PYTHONPATH:/speculos pytest --headless --model=nanosp --benchmark-json=benchmarks.json
      - name: Upload benchmarks summary
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-log
          path: tests_perf/benchmarks.json

  job_test_js_lib:
    name: Tests with the JS library
    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/speculos:latest
      ports:
        - 1234:1234
        - 9999:9999
        - 40000:40000
        - 41000:41000
        - 42000:42000
        - 43000:43000
      options: --entrypoint /bin/bash

    steps:
      - name: Install git (required by checkout)
        run: apt-get update && apt-get install -y git
      - name: Clone
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yarn
        run: |
          npm install -g yarn

      - name: Download Syscoin Testnet app binary
        uses: actions/download-artifact@v4
        with:
          name: syscoin-testnet-app-nanosp
          path: bin

      - name: Run tests
        run: |
          cd bitcoin_client_js
          yarn install
          LOG_SPECULOS=1 LOG_APDUS=1 SPECULOS="/speculos/speculos.py" yarn test

  job_test_rust_client:
    name: Tests for rust client library
    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          cd bitcoin_client_rs/
          cargo test --no-default-features --features="async"
